# Run after a maintainer approves the staged package on npmjs.com with 2FA.
name: Release approved npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Approved release tag (for example, v4.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v${VERSION}" != "${RELEASE_TAG}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package.json version ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Verify npm package is publicly available
        run: |
          for attempt in $(seq 1 10); do
            PUBLISHED=$(npm view "@uvl000/claude-trace@${VERSION}" version --prefer-online 2>/dev/null || true)
            if [ "${PUBLISHED}" = "${VERSION}" ]; then
              echo "Verified @uvl000/claude-trace@${VERSION} on npm"
              exit 0
            fi
            echo "Waiting for npm approval or registry sync (${attempt}/10)"
            sleep 3
          done
          echo "::error::Approve @uvl000/claude-trace@${VERSION} on npm before creating a GitHub Release"
          exit 1

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists, skipping"
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            --repo "${REPO}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --notes "$(cat <<'EOF'
          ## Install
          ```bash
          npm install -g @uvl000/claude-trace
          ```
          EOF
          )"
