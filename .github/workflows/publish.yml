# 通过 npm Trusted Publishing（OIDC）提交待审核包。
# npm Trusted Publisher: owner=FlyingFish-233, repo=claude-trace,
# workflow=publish.yml, environment 留空；staging 权限默认启用。
name: Stage npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to stage
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: stage-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with staged publishing support
        run: npm install -g "npm@^11.15.0"

      - name: Verify npm supports staged publishing
        run: |
          node --version
          NPM_VERSION="$(npm --version)"
          echo "npm ${NPM_VERSION}"
          node -e "
            const [major, minor, patch] = process.argv[1].split('.').map(Number);
            if (major < 11 || (major === 11 && minor < 15)) {
              console.error('npm ' + process.argv[1] + ' is too old; need >= 11.15.0 for staged publishing');
              process.exit(1);
            }
          " "${NPM_VERSION}"

      - name: Verify tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v${VERSION}" != "${RELEASE_TAG}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package.json version ${VERSION}"
            exit 1
          fi
          echo "Staging ${RELEASE_TAG} (package.json ${VERSION})"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Smoke test CLI
        run: node dist/cli/cli.js --help

      - name: Preview package contents
        run: npm pack --dry-run

      - name: Stage package on npm (OIDC)
        run: npm stage publish
